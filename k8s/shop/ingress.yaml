apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-next
  namespace: shop
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${SHOP_HOSTNAME}
      secretName: shop-next-tls
  rules:
    - host: ${SHOP_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-next
                port:
                  number: 3000
