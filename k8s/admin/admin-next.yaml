apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-admin
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-admin
  template:
    metadata:
      labels:
        app: shop-admin
    spec:
      containers:
        - name: shop-admin
          image: ${ADMIN_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          envFrom:
            - secretRef:
                name: shop-admin-auth
          readinessProbe:
            httpGet:
              path: /signin
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /signin
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: shop-admin
  namespace: shop
spec:
  selector:
    app: shop-admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
