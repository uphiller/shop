apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: shop
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # board-platform Ingress와 동일 호스트 충돌 시 shop Keycloak 우선
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${KEYCLOAK_HOSTNAME}
      secretName: keycloak-tls
  rules:
    - host: ${KEYCLOAK_HOSTNAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
